appId: org.kificut.app
productName: Kificut
copyright: Copyright © 2026 Kificut contributors

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # ONNX Runtime for custom voices (src/main/voice-engine.ts): only this build's platform and
  # architecture, without the GPU providers, the second copy of the macOS library (the binding
  # loads libonnxruntime.1.dylib), the TypeScript sources and the install scripts.
  - '!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/${platform}/!(${arch})/**'
  - '!node_modules/onnxruntime-node/bin/**/*{cuda,tensorrt}*'
  - '!node_modules/onnxruntime-node/bin/**/libonnxruntime.*.*.*.dylib'
  - '!node_modules/onnxruntime-node/{lib,script}/**'

# Native libraries cannot be loaded from inside the asar archive.
asarUnpack:
  - node_modules/onnxruntime-node/bin/**

# FFmpeg runs as a separate process, so the binaries ship as plain resources outside the asar.
extraResources:
  - from: node_modules/ffmpeg-static
    to: bin
    filter:
      - ffmpeg
      - ffmpeg.exe
  - from: vendor/ffprobe
    to: bin
    filter:
      - ffprobe
      - ffprobe.exe
  - from: node_modules/ffmpeg-static
    to: licenses
    filter:
      - ffmpeg.LICENSE
  - from: LICENSE
    to: licenses/LICENSE
  # The Claude Desktop connector, opened by Settings > Claude > Install in Claude Desktop.
  - from: connectors/claude/dist
    to: connectors
    filter:
      - '*.mcpb'
  # The same server, run by Claude Code with Kificut's executable (Settings > Claude > Connect Claude Code).
  - from: connectors/claude/build/server/index.js
    to: connectors/kificut-mcp.js

fileAssociations:
  - ext: kificut
    name: Kificut Project
    description: Kificut video project
    role: Editor
    mimeType: application/x-kificut-project

mac:
  category: public.app-category.video
  icon: build/icon.png
  extendInfo:
    NSMicrophoneUsageDescription: Kificut uses the microphone when you record your voice for voiceovers in your own voice.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  title: ${productName} ${version}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Kificut

# The static AppImage runtime, which needs no libfuse2 (missing by default on Ubuntu 22.04 and later).
toolsets:
  appimage: '1.0.3'

linux:
  icon: build/icon.png
  # Lets the desktop match Kificut's windows to its launcher icon.
  syncDesktopName: true
  category: AudioVideo
  target:
    - AppImage
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# Writes app-update.yml into the app and latest.yml next to the Windows installer, which the
# in-app updater reads from the GitHub release. CI builds with --publish never and attaches the
# files itself.
publish:
  provider: github
  owner: Kificut-app
  repo: kificut
