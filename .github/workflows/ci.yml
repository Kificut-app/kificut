name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
            arch: ''
          - name: macOS Apple Silicon
            os: macos-latest
            args: --mac --arm64
            arch: ''
          - name: macOS Intel
            os: macos-latest
            args: --mac --x64
            # Makes ffmpeg-static download the Intel binary on the Apple Silicon runner.
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Set CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID etc. for notarization) as repository
          # secrets to produce signed builds. Without them the installers are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: Kificut ${{ matrix.name }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
          if-no-files-found: error
