name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: win-x64
            os: windows-latest
            args: --win --x64
          - name: macOS Apple Silicon
            id: mac-arm64
            os: macos-latest
            args: --mac --arm64
            expect: arm64
          - name: macOS Intel
            id: mac-x64
            os: macos-latest
            args: --mac --x64
            expect: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner is Apple Silicon, so swap in Intel FFmpeg and FFprobe binaries for the Intel
      # build. Only those two change; the build tools must stay native to run here.
      - name: Use Intel FFmpeg binaries
        if: matrix.id == 'mac-x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          npm_config_arch=x64 node scripts/fetch-ffprobe.mjs
      - run: npm run build
      - name: Package
        shell: bash
        env:
          # Add CSC_LINK and CSC_KEY_PASSWORD as repository secrets for signed builds, plus
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarize on macOS.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a certificate, sign macOS builds ad hoc. Apple Silicon Macs refuse to open
            # apps with no signature at all.
            if [ "$RUNNER_OS" = "macOS" ]; then extra+=(--config.mac.identity=-); fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never "${extra[@]}"
      - name: Check the bundled FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d release/*/mac*/Kificut.app)
            for tool in ffmpeg ffprobe; do
              info=$(file "$app/Contents/Resources/bin/$tool")
              echo "$info"
              # Every binary must match the build, not just one of them.
              echo "$info" | grep -q "${{ matrix.expect }}" || { echo "::error::$tool has the wrong architecture"; exit 1; }
            done
            codesign --verify --deep --verbose=1 "$app"
            test -f "$app"/Contents/Resources/connectors/*.mcpb
            test -f "$app"/Contents/Resources/connectors/kificut-mcp.js
          else
            ls -l release/*/win-unpacked/resources/bin
            test -f release/*/win-unpacked/resources/connectors/*.mcpb
            test -f release/*/win-unpacked/resources/connectors/kificut-mcp.js
            test -f release/*/win-unpacked/resources/app-update.yml
            test -f release/*/latest.yml
            test -f release/*/win-unpacked/resources/bin/ffmpeg.exe
            test -f release/*/win-unpacked/resources/bin/ffprobe.exe
          fi
          # Noise reduction needs the arnndn filter, and background removal for video needs libvpx.
          if [ "$RUNNER_OS" = "macOS" ]; then ffmpeg="$app/Contents/Resources/bin/ffmpeg"; else ffmpeg=$(ls release/*/win-unpacked/resources/bin/ffmpeg.exe); fi
          if "$ffmpeg" -version > /dev/null 2>&1; then
            "$ffmpeg" -hide_banner -filters | grep -q ' arnndn ' || { echo "::error::FFmpeg has no arnndn filter"; exit 1; }
            "$ffmpeg" -hide_banner -encoders | grep -q ' libvpx-vp9 ' || { echo "::error::FFmpeg has no libvpx-vp9 encoder"; exit 1; }
            "$ffmpeg" -hide_banner -decoders | grep -q ' libvpx-vp9 ' || { echo "::error::FFmpeg has no libvpx-vp9 decoder"; exit 1; }
          else
            echo "::warning::Could not run the bundled FFmpeg on this runner to check its filters"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kificut-${{ matrix.id }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/latest.yml
            release/*/*.exe.blockmap
            connectors/claude/dist/*.mcpb
          if-no-files-found: error

  release:
    name: Draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Installing

          These builds are not code signed yet. On macOS, try to open the app once, then go to System Settings > Privacy & Security and choose Open Anyway. On Windows, choose More info and then Run anyway if SmartScreen asks.
          EOF
          # Artifacts keep their release/<version>/ folders, so collect the installer files themselves.
          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.mcpb' -o -name 'latest.yml' -o -name '*.exe.blockmap' \) | sort)
          printf '%s\n' "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run of this job attaches the files to the draft created earlier.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag --title "Kificut $version" --notes-file notes.md
          fi
